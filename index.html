<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A4E5A">
<title>Laundry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6F8;--dark:#0A4E5A;--pri:#0E6F7E;--light:#D6ECEF;--text:#12232E;--muted:#51626E;--line:#DDE5EA;--line2:#C9D5DC;--danger:#9B2D20;--blue:#2A78B8;--ok:#14693A}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
a{color:inherit}
#app{min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
@media(min-width:900px){.wrap{padding:28px}}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card.tight{padding:0;gap:0;overflow:hidden}
.lab{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
@media(min-width:900px){.h1{font-size:28px}}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--pri);background:#fff;color:var(--dark);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--pri);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.dangerfill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.big{min-height:52px;border-radius:14px;font-size:16px}
.btn.block{width:100%}
.btn.locked,.btn:disabled{background:#E8EEF2;border-color:#E8EEF2;color:#7C8A94}
.back{min-height:44px;padding:0 16px 0 12px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--dark)}
.ico{width:44px;height:44px;border-radius:12px;background:var(--light);color:var(--dark);display:flex;align-items:center;justify-content:center;flex:none}
.av{width:44px;height:44px;border-radius:22px;background:var(--light);color:var(--dark);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.pill{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.p-rec{background:#E3F0FB;color:#0B5690}.p-comp{background:#E8EEF2;color:#3F4F5A}.p-canc,.p-unpaid{background:#FBE3E0;color:var(--danger)}.p-paid{background:#DCF4E5;color:var(--ok)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line2);background:#fff;font-size:14px;font-weight:600}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:26px;font-weight:800;letter-spacing:-.01em}
.kpi.locked{background:#EEF2F5;color:#7C8A94}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{min-height:92px;border-radius:16px;border:1px solid var(--line);background:#fff;padding:14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;font-weight:700;font-size:15px;text-decoration:none;text-align:left}
.tile.main{background:var(--pri);border-color:var(--pri);color:#fff}
.tile.locked{background:#EEF2F5;color:#7C8A94;cursor:not-allowed}
.list>*{border-bottom:1px solid #E8EEF2}.list>*:last-child{border-bottom:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:64px;background:none;border:0;width:100%;text-align:left;text-decoration:none}
.item.link:hover{background:#F7FAFB}
.field{position:relative;display:block}
.field .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;display:flex;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;height:52px;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:0 14px 0 46px}
.field textarea{height:auto;padding-top:14px;padding-bottom:14px;line-height:1.4;resize:none}
.field.ta .ic{top:18px;transform:none}
.field label{position:absolute;left:46px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;transition:opacity .1s}
.field.ta label{top:18px;transform:none}
.field input:focus+label,.field input:not(:placeholder-shown)+label,.field textarea:focus+label,.field textarea:not(:placeholder-shown)+label{opacity:0}
.field select{appearance:none;background:#fff}
.err{color:var(--danger);font-size:14px;font-weight:600}
.strip{padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
.strip.warn{background:#FBE3E0;color:var(--danger)}
.strip.info{background:#E3F0FB;color:#0B5690}
.strip.ok{background:#DCF4E5;color:var(--ok)}
.seg{display:flex;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:48px;border:0;background:#fff;font-weight:600}
.seg button.on{background:var(--dark);color:#fff}
.sw{flex:none;width:52px;height:32px;border-radius:16px;border:0;background:#B8C4CC;position:relative}
.sw[aria-checked=true]{background:var(--pri)}
.sw i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .12s}
.sw[aria-checked=true] i{left:24px}
.ovl{position:fixed;inset:0;background:rgba(10,30,40,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:480px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:20px;font-weight:800}
@media(max-width:640px){.ovl{align-items:flex-end;padding:0}.modal{max-width:none;border-radius:18px 18px 0 0}}
.sticky{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:5}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.dots i{width:16px;height:16px;border-radius:8px;border:2px solid var(--pri)}
.dots i.f{background:var(--pri)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;width:100%}
.pad button{min-height:62px;border-radius:16px;border:1px solid var(--line2);background:#fff;font-size:24px;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:8px;overflow-x:auto}
.bar{flex:1 0 22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{width:100%;background:var(--pri);border-radius:6px 6px 0 0;min-height:2px}
.bar span{font-size:11px;color:var(--muted)}
.rec{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.35;white-space:pre;background:#fff;border:1px dashed var(--line2);border-radius:8px;padding:14px;overflow-x:auto}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span:first-child{color:var(--muted)}.kv span:last-child{font-weight:600;text-align:right}
.two{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.two>.l{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px}
.two>.r{flex:1 1 340px;max-width:460px;display:flex;flex-direction:column;gap:16px}
.menu{position:absolute;right:0;top:52px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;min-width:220px;box-shadow:0 10px 30px rgba(10,30,40,.15);z-index:20;display:flex;flex-direction:column;gap:10px}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px;text-align:center}
.qty{display:flex;align-items:center;gap:6px}
.qty input{width:84px;height:48px;border:1px solid var(--line2);border-radius:10px;text-align:center;font-weight:700}
.qty button{width:44px;height:48px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-size:22px;font-weight:700}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ====== SETTING: paste the Apps Script web app address here (ends with /exec) ====== */
const API_URL = 'PASTE_WEB_APP_ADDRESS_HERE';

/* ---------- tiny helpers ---------- */
const $app = document.getElementById('app');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dots3 = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

const qtyText = (q) => String(q).replace('.', ',');
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };

const ssSet = (k, v) => { try { if (v === null) { sessionStorage.removeItem(k); } else { sessionStorage.setItem(k, v); } } catch (e) { /* ignore */ } };

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'c' + Date.now() + Math.random().toString(36).slice(2));
const todayStr = () => { const d = new Date(); const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };

const IC = {
  back: '<path d="M19 12H5M11 6l-6 6 6 6"/>', plus: '<path d="M12 5v14M5 12h14"/>', edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.500 3-5.500 7-5.500s7 2 7 5.500"/><path d="M16 4.500a3.500 3.500 0 0 1 0 7M18 15c2.500.7 4 2.300 4 5"/>',
  print: '<path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="9" rx="2"/><path d="M7 14h10v7H7z"/>', wa: '<path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/><path d="M9 9c0 3 3 6 6 6l1-2-2-1-1 1c-1-.5-2-1.500-2.500-2.500l1-1-1-2z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>', check: '<path d="M5 12l5 5 9-10"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', orders: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.900 4.900l2.100 2.100M17 17l2.100 2.100M4.900 19.100L7 17M17 7l2.100-2.100"/>',
  report: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>', money: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
  cat: '<path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/>', phone: '<path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>', pin: '<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.500"/>',
  tag: '<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.500" cy="7.500" r="1.500"/>', cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  note: '<path d="M5 3h10l4 4v14H5z"/><path d="M9 12h6M9 16h6"/>', down: '<path d="M6 9l6 6 6-6"/>', bt: '<path d="M7 7l10 10-5 4V3l5 4L7 17"/>',
  soap: '<path d="M7 11h10v9a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1z"/><path d="M9 11V8h6v3M12 3v3"/>', rent: '<path d="M3 11l9-7 9 7v9H3z"/><path d="M10 20v-6h4v6"/>',
  supplies: '<path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/>', transport: '<path d="M3 17V7h11v10M14 10h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  utilities: '<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>', wages: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  shirt: '<path d="M8 3l-5 4 3 4 2-1v11h8V10l2 1 3-4-5-4a4 4 0 0 1-8 0z"/>', bed: '<path d="M3 18V7"/><path d="M3 14h18v4"/><path d="M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.600"/>',
  star: '<path d="M12 3l2.700 5.600 6.100.9-4.400 4.300 1 6.100-5.400-2.900-5.400 2.900 1-6.100L3.200 9.500l6.100-.9z"/>', bag: '<path d="M5 8h14l-1 13H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>'

const svg = (n, s) => '<svg aria-hidden="true" width="' + (s || 20) + '" height="' + (s || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (IC[n] || IC.tag) + '</svg>';
const ICON_CHOICES = ['soap', 'rent', 'supplies', 'transport', 'utilities', 'wages', 'shirt', 'bed', 'star', 'bag', 'tag'];

/* ---------- state ---------- */
const S = { token: ssGet('lt'), me: null, data: null, view: null, offline: !navigator.onLine, busy: false, modal: null, notice: '', menu: false, lastActive: Date.now() };

/* ---------- server calls ---------- */
async function api(action, payload) {
  if (!API_URL || API_URL.indexOf('PASTE_') === 0) { throw { code: 'setup', message: 'The app is not connected yet. Paste the web app address into index.html (API_URL).' }; }
  let res;
  try {
    res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: action, token: S.token }, payload || {})) });
  } catch (e) { throw { code: 'network', message: 'No connection. Check the internet and try again.' }; }
  let j;
  try { j = await res.json(); } catch (e) { throw { code: 'network', message: 'The server did not answer. Try again.' }; }
  if (!j.ok) {
    if (j.code === 'auth') { signOutLocal(j.message || 'Your sign-in expired. Please sign in again.'); }
    throw { code: j.code, message: j.message };
  }
  return j.data;
}
function signOutLocal(msg) { S.token = null; S.me = null; S.data = null; S.modal = null; ssSet('lt', null); S.notice = msg || ''; render(); }
async function signOut() { try { await api('logout'); } catch (e) { /* ignore */ } signOutLocal(''); }

/* ---------- permissions ---------- */
const can = (p) => !!(S.me && S.me.perms && S.me.perms[p]);

/* ---------- receipt ---------- */
function paperCols() { return lsGet('paper', '58') === '80' ? 48 : 32; }
function receiptLines(o, st) {
  const W = paperCols();
  const pad = (l, r) => l + ' '.repeat(Math.max(1, W - l.length - r.length)) + r;
  const ctr = (t) => ' '.repeat(Math.max(0, Math.floor((W - t.length) / 2))) + t;
  const wrap = (t) => { const out = []; let line = ''; String(t).split(/\s+/).forEach((w) => { if (!w) { return; } if ((line + ' ' + w).trim().length > W) { if (line) { out.push(line); } line = w; } else { line = (line + ' ' + w).trim(); } }); if (line) { out.push(line); } return out; };
  const d = '-'.repeat(W);
  const out = [];
  wrap(st.shop_name || '').forEach((l) => out.push(ctr(l)));
  wrap(st.shop_address || '').forEach((l) => out.push(ctr(l)));
  if ((st.header_text || '').trim()) { wrap(st.header_text).forEach((l) => out.push(ctr(l))); }
  out.push(d, o.id, dateText(o.receivedAt).replace(',', ''), o.customerName + (o.customerLast4 ? ' · ' + o.customerLast4 : ''), d);
  let sub = 0;
  o.items.forEach((i) => { sub += i.subtotal; out.push(i.name); out.push(pad(qtyText(i.qty) + ' ' + (i.unit || unitOf(i)) + ' x ' + dots3(i.unitPrice), dots3(i.subtotal))); });
  out.push(d, pad('Subtotal', dots3(sub)));
  const rnd = o.total - sub;
  if (rnd !== 0) { out.push(pad('Rounding', (rnd > 0 ? '+' : '-') + dots3(Math.abs(rnd)))); }
  out.push(pad('TOTAL', 'IDR ' + dots3(o.total)));
  out.push(pad('Status', o.status === 'Cancelled' ? 'CANCELLED' : (o.paid ? 'PAID' : 'UNPAID')));
  if ((o.note || '').trim()) { out.push(d); wrap('Notes: ' + o.note.trim()).forEach((l) => out.push(l)); }
  if ((st.receipt_footer || '').trim()) { out.push(d); wrap(st.receipt_footer).forEach((l) => out.push(l)); }
  return out;
}
function unitOf(item) { const s = (S.data && S.data.services || []).find((x) => x.id === item.serviceId); return s ? s.unit : 'kg'; }
const receiptText = (o) => receiptLines(o, S.data.settings).join('\n');
const waLink = (o) => 'https://wa.me/' + o.customerPhone + '?text=' + encodeURIComponent('```\n' + receiptText(o) + '\n```');

/* ---------- printer (Bluetooth LE, or the RawBT app) ---------- */
const PRINTER = { dev: null, ch: null };
const BLE_SERVICES = ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '0000ff00-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', '0000fee7-0000-1000-8000-00805f9b34fb'];
const printerMode = () => lsGet('printer_mode', 'ble');
const ascii = (t) => t.replace(/·/g, '-').replace(/[^\x09\x0a\x20-\x7e]/g, '?');
function escpos(text) {
  const body = new TextEncoder().encode(ascii(text) + '\n\n\n\n');
  const out = new Uint8Array(2 + body.length);
  out[0] = 0x1b; out[1] = 0x40; out.set(body, 2);
  return out;
}
async function bleConnect() {
  if (!navigator.bluetooth) { throw new Error('This browser cannot use Bluetooth. Use Chrome on Android, or switch to the RawBT app in Settings.'); }
  const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BLE_SERVICES });
  const server = await dev.gatt.connect();
  const services = await server.getPrimaryServices();
  let ch = null;
  for (const sv of services) {
    const chars = await sv.getCharacteristics();
    for (const c of chars) { if (!ch && (c.properties.write || c.properties.writeWithoutResponse)) { ch = c; } }
  }
  if (!ch) { throw new Error('Connected, but this printer has no writable channel. Try the RawBT app instead.'); }
  PRINTER.dev = dev; PRINTER.ch = ch;
  dev.addEventListener('gattserverdisconnected', () => { PRINTER.ch = null; });
  return dev.name || 'Printer';
}
async function bleWrite(bytes) {
  if (!PRINTER.ch || !PRINTER.dev.gatt.connected) { await bleConnect(); }
  for (let i = 0; i < bytes.length; i += 100) {
    const chunk = bytes.slice(i, i + 100);
    if (PRINTER.ch.properties.writeWithoutResponse) { await PRINTER.ch.writeValueWithoutResponse(chunk); } else { await PRINTER.ch.writeValue(chunk); }
    await new Promise((r) => setTimeout(r, 25));
  }
}
async function printText(text) {
  const bytes = escpos(text);
  if (printerMode() === 'rawbt') {
    let bin = ''; bytes.forEach((b) => { bin += String.fromCharCode(b); });
    const a = document.createElement('a'); a.href = 'rawbt:base64,' + btoa(bin); document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  await bleWrite(bytes);
}

/* A save button: shows Saving..., then "Not saved. Try again" if the connection fails. */
async function saving(btnId, fn) {

  }
}

async function renderLogin() {

  if (st.needsSetup) { return renderSetup(); }
  let pin = '', busy = false;
  const paint = (msg, isErr) => {
    $app.innerHTML = '<div class="center"><div class="login"><div><div class="ico" style="margin:0 auto 12px;width:56px;height:56px;border-radius:16px">' + svg('lock', 28) + '</div><h1 class="h1">Enter your PIN</h1><div class="muted" style="margin-top:6px">6 digits</div></div><div class="dots" aria-label="' + pin.length + ' of 6 digits entered">' + [0, 1, 2, 3, 4, 5].map((i) => '<i class="' + (i < pin.length ? 'f' : '') + '"></i>').join('') + '</div><div style="min-height:24px" role="status" class="' + (isErr ? 'err' : 'muted') + '">' + esc(msg || S.notice || '') + '</div><div class="pad">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => '<button data-k="' + n + '">' + n + '</button>').join('') + '<span></span><button data-k="0">0</button><button data-k="del" aria-label="Delete">' + svg('back', 24) + '</button></div></div></div>';
    $app.querySelectorAll('[data-k]').forEach((b) => { b.onclick = () => press(b.dataset.k); });
  };
  const press = async (k) => {
    if (busy) { return; }
    S.notice = '';

    if (pin.length >= 6) { return; }
    pin += k; paint();

  paint();
}

  openModal('<h2>' + (x ? 'Edit expense' : 'New expense') + '</h2>' + catSelect('xc', 'expense', keep.cat || (x && x.categoryId)) + field('xd', 'cal', 'Date', keep.date || (x ? x.at.slice(0, 10) : todayStr()), { type: 'date' }) + field('xn', 'tag', 'Name', keep.name !== undefined ? keep.name : (x && x.name)) + field('xp', 'money', 'Price (IDR)', keep.price !== undefined ? keep.price : (x && x.price), { mode: 'numeric' }) + '<div id="merr" class="err" hidden></div><button class="btn pri big block" id="xs">Save</button>' + (x ? (can('owner') ? '<button class="btn danger block" id="xdl">' + svg('trash') + 'Delete expense</button>' : lockedBtn('Delete expense')) : '') + '<button class="btn block" id="xx">Cancel</button>', () => {
    wireCatSelect('xc', 'expense', () => ({ date: val('xd'), name: val('xn'), price: val('xp') }), (k, newId) => expenseModal(x, Object.assign(k, { cat: newId })));
    document.getElementById('xx').onclick = closeModal;
    document.getElementById('xs').onclick = () => saving('xs', async () => { await api('expense.save', { id: x ? x.id : undefined, categoryId: val('xc'), date: val('xd'), name: val('xn'), price: val('xp').replace(/\D/g, '') }); closeModal(); render(); });
    const d = document.getElementById('xdl'); if (d) { d.onclick = () => confirmModal('Delete this expense?', 'This cannot be undone.', 'Yes, delete', async () => { await api('expense.delete', { id: x.id }); closeModal(); render(); }); }
  });
}

/* ================= Reports ================= */
let RP = { period: 'today', from: '', to: '' };
async function vReports() {
  if (!can('reports')) { return $app.innerHTML = '<div class="wrap">' + topBar('Reports', '#/') + '<div class="card">' + lockedBtn('Reports') + '</div></div>'; }
  const draw = (r, err) => {
    const rows = (a, empty) => a.length ? a.map((x) => '<div class="kv"><span>' + esc(x.name) + '</span><span>' + money(x.amount) + '</span></div>').join('') : '<div class="muted small">' + empty + '</div>';
    const keys = r ? Object.keys(r.buckets).sort() : []; const mx = r ? Math.max.apply(null, keys.map((k) => r.buckets[k]).concat([1])) : 1;
    const chart = !r ? '' : keys.length ? '<div class="bars" role="img" aria-label="Sales chart">' + keys.map((k) => '<div class="bar" title="' + esc(k) + ': ' + money(r.buckets[k]) + '"><i style="height:' + Math.max(2, Math.round(r.buckets[k] / mx * 110)) + 'px"></i><span>' + (r.bucketKind === 'hour' ? k + 'h' : k.slice(8)) + '</span></div>').join('') + '</div>' : '<div class="muted small">No sales in this period.</div>';
    $app.innerHTML = '<div class="wrap">' + offlineStrip() + topBar('Reports', '#/', '<button class="btn" id="csv">' + svg('down') + 'Export CSV</button>') + '<div class="chips">' + [['today', 'Today'], ['week', 'This week'], ['month', 'This month'], ['custom', 'Custom']].map((p) => '<button class="chip' + (RP.period === p[0] ? ' on' : '') + '" data-p="' + p[0] + '">' + p[1] + '</button>').join('') + '</div>' +
      (RP.period === 'custom' ? '<div class="card"><div class="row" style="flex-wrap:wrap"><div class="grow" style="min-width:150px">' + field('rf', 'cal', 'From', RP.from, { type: 'date' }) + '</div><div class="grow" style="min-width:150px">' + field('rt', 'cal', 'To', RP.to, { type: 'date' }) + '</div></div>' + (err ? '<div class="err">' + esc(err) + '</div>' : '') + '</div>' : '') +
      (r ? '<div class="muted small">' + esc(dateText(r.range[0])) + (r.range[0] === r.range[1] ? '' : ' to ' + esc(dateText(r.range[1]))) + '</div><div class="kpis"><div class="kpi"><span class="small muted" style="font-weight:600">Sales</span><b>' + money(r.sales) + '</b></div><div class="kpi"><span class="small muted" style="font-weight:600">Expenses</span><b>' + money(r.expenses) + '</b></div><div class="kpi"><span class="small muted" style="font-weight:600">Profit</span><b style="color:' + (r.profit < 0 ? 'var(--danger)' : 'inherit') + '">' + money(r.profit) + '</b><span class="small muted">Sales minus expenses</span></div><div class="kpi"><span class="small muted" style="font-weight:600">Orders</span><b>' + r.orders + '</b><span class="small muted">Average ' + money(r.averageOrder) + '</span></div></div>' +
      '<div class="card"><div class="lab">' + (r.bucketKind === 'hour' ? 'Sales by hour' : 'Sales by day') + '</div>' + chart + '</div>' +
      '<div class="two"><div class="l"><div class="card"><div class="lab">Best-selling services</div>' + rows(r.services, 'No sales yet.') + '</div><div class="card"><div class="lab">Cancelled orders</div><div class="small muted" style="margin-top:-8px">Not counted in any number above</div><div class="kv"><span>Orders cancelled</span><span>' + r.cancelledCount + '</span></div><div class="kv"><span>Value of cancelled orders</span><span>' + money(r.cancelledValue) + '</span></div>' + r.cancelled.map((c) => '<a class="kv" href="#/order/' + encodeURIComponent(c.id) + '" style="text-decoration:none"><span>' + esc(c.customerName) + '<br><span class="small">' + esc(c.id) + ' · ' + esc(dateText(c.receivedAt.slice(0, 10))) + '</span></span><span>' + money(c.total) + '</span></a>').join('') + '</div></div>' +
      '<div class="r"><div class="card"><div class="lab">Payments</div><div class="kv"><span>Paid</span><span>' + money(r.paid) + '</span></div><div class="kv"><span>Unpaid</span><span>' + money(r.unpaid) + '</span></div></div><div class="card"><div class="lab">By payment method</div>' + rows(r.byMethod, 'No payments yet.') + '</div><div class="card"><div class="lab">Expenses by category</div>' + rows(r.expensesByCategory, 'No expenses.') + '</div></div></div>' : '<div class="card muted"><span class="spin"></span> Loading...</div>') + '</div>';
    $app.querySelectorAll('[data-p]').forEach((b) => { b.onclick = () => { RP.period = b.dataset.p; if (RP.period === 'custom' && !RP.from) { RP.from = RP.to = todayStr(); } vReports(); }; });
    ['rf', 'rt'].forEach((id) => { const e = document.getElementById(id); if (e) { e.onchange = () => { RP.from = val('rf'); RP.to = val('rt'); vReports(); }; } });
    const c = document.getElementById('csv'); if (c && r) { c.onclick = () => downloadCsv(r); }
  };
  draw(null);
  try { draw(await api('report', { period: RP.period === 'custom' ? 'custom' : RP.period, from: RP.from, to: RP.to })); } catch (e) { if (e.code === 'invalid') { draw(null, e.message); } else if (S.token) { throw e; } }
}
function downloadCsv(r) {
  const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const head = ['Order', 'Received at', 'Customer', 'Items', 'Total (IDR)', 'Payment', 'Method', 'Status', 'Created by'];
  const lines = [head.map(q).join(',')].concat(r.rows.map((x) => [x.id, x.receivedAt, x.customer, x.items, x.total, x.payment, x.method, x.status, x.createdBy].map(q).join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'orders-' + r.range[0] + '-to-' + r.range[1] + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ================= Settings ================= */
async function vSettings() {
  if (!can('owner')) { return $app.innerHTML = '<div class="wrap">' + topBar('Settings', '#/') + '<div class="card">' + lockedBtn('Settings') + '</div></div>'; }
  const st = S.data.settings;
  const paper = lsGet('paper', '58'), mode = printerMode();
  const sample = { id: (st.order_prefix || 'LD') + '-261027-0412', receivedAt: '2026-10-27 16:05', customerName: 'Rina Kusuma', customerLast4: '3344', items: [{ name: 'Wash + Iron', qty: 4.2, unit: 'kg', unitPrice: 7000, subtotal: 29400 }], total: 29400, paid: true, status: 'Received', note: 'Stain on the white shirt' };
  $app.innerHTML = '<div class="wrap">' + offlineStrip() + topBar('Settings', '#/') +
    '<div class="card"><div class="row between"><span class="lab">Printer</span><span class="small muted">Saved on this device only</span></div><div class="row"><span class="ico">' + svg('print', 24) + '</span><div class="grow"><b>' + (PRINTER.dev ? esc(PRINTER.dev.name || 'Printer') : 'No printer connected') + '</b><div class="small muted">' + (PRINTER.dev ? 'Connected' : 'Switch the printer on, then tap Connect.') + '</div></div></div><div class="seg" role="group" aria-label="How to print"><button data-m="ble" class="' + (mode === 'ble' ? 'on' : '') + '">Bluetooth (Chrome)</button><button data-m="rawbt" class="' + (mode === 'rawbt' ? 'on' : '') + '">RawBT app</button></div><div class="seg" role="group" aria-label="Paper width"><button data-w="58" class="' + (paper === '58' ? 'on' : '') + '">58 mm</button><button data-w="80" class="' + (paper === '80' ? 'on' : '') + '">80 mm</button></div><div class="row" style="flex-wrap:wrap"><button class="btn pri" id="pc">' + svg('bt') + 'Connect printer</button><button class="btn" id="pt">Print test receipt</button></div><div id="pmsg" class="small"></div><div class="small muted">Chrome on Android can connect to Bluetooth printers directly. If your printer does not show up, switch to the RawBT app: install it, pair the printer there, and the app will send receipts through it.</div></div>' +
    '<div class="card"><div class="row between"><span class="lab">ID prefixes</span><span class="small muted">Shared by all devices</span></div><div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">' + [['order_prefix', 'Orders'], ['customer_prefix', 'Customers'], ['service_prefix', 'Services'], ['category_prefix', 'Categories'], ['expense_prefix', 'Expenses'], ['user_prefix', 'Users']].map((p) => field(p[0], 'tag', p[1], st[p[0]], { max: 6 })).join('') + '</div><div class="small muted">Letters and numbers only, up to 6. A change only affects new records. Old order numbers and printed receipts stay the same.</div></div>' +
    '<div class="two"><div class="l"><a class="card" href="#/categories" style="text-decoration:none"><div class="row"><span class="ico">' + svg('cat', 24) + '</span><div class="grow"><b>Categories</b><div class="small muted">For services and expenses</div></div>' + svg('back', 20).replace('<svg', '<svg style="transform:rotate(180deg)"') + '</div></a><a class="card" href="#/users" style="text-decoration:none"><div class="row"><span class="ico">' + svg('users', 24) + '</span><div class="grow"><b>Users and access</b><div class="small muted">PINs and what staff can do</div></div>' + svg('back', 20).replace('<svg', '<svg style="transform:rotate(180deg)"') + '</div></a>' +
    '<div class="card"><div class="row between"><span class="lab">Receipt text</span><span class="small muted">Shared by all devices</span></div>' + field('shop_name', 'tag', 'Shop name', st.shop_name) + field('shop_address', 'pin', 'Address and phone (optional)', st.shop_address) + field('header_text', 'note', 'Header text (optional)', st.header_text, { max: 120 }) + field('receipt_footer', 'note', 'Footer text (optional)', st.receipt_footer, { area: true, rows: 3, max: 120 }) + '<div class="small muted">Up to 120 characters. About 32 characters fit on one line on 58 mm paper.</div></div></div>' +
    '<div class="r"><div class="card"><div class="row between"><span class="lab">Receipt preview</span><span class="small muted">' + paper + ' mm paper</span></div><div class="rec" id="prev"></div><div class="small muted">Sample order shown. The preview updates as you type.</div></div><button class="btn pri big block" id="save">Save settings</button><div id="smsg" role="status"></div></div></div></div>';
  const prev = () => { const cur = Object.assign({}, st); ['shop_name', 'shop_address', 'header_text', 'receipt_footer', 'order_prefix'].forEach((k) => { cur[k] = val(k); }); sample.id = (cur.order_prefix || 'LD').toUpperCase() + '-261027-0412'; document.getElementById('prev').textContent = receiptLines(sample, cur).join('\n'); };
  ['shop_name', 'shop_address', 'header_text', 'receipt_footer', 'order_prefix'].forEach((k) => { document.getElementById(k).oninput = prev; }); prev();
  $app.querySelectorAll('[data-m]').forEach((b) => { b.onclick = () => { lsSet('printer_mode', b.dataset.m); vSettings(); }; });
  $app.querySelectorAll('[data-w]').forEach((b) => { b.onclick = () => { lsSet('paper', b.dataset.w); vSettings(); }; });
  const msg = (t, bad) => { const e = document.getElementById('pmsg'); e.textContent = t; e.className = 'small ' + (bad ? 'err' : ''); };
  document.getElementById('pc').onclick = async () => { if (printerMode() === 'rawbt') { return msg('RawBT is selected. Nothing to connect here: pair the printer inside the RawBT app.'); } try { const n = await bleConnect(); msg('Connected to ' + n + '.'); vSettings(); } catch (e) { if (e && e.name === 'NotFoundError') { return msg('No printer was chosen.'); } msg((e && e.message) || 'Could not connect.', true); } };
  document.getElementById('pt').onclick = async () => { try { await printText(receiptLines(sample, Object.assign({}, st, { shop_name: val('shop_name'), shop_address: val('shop_address'), header_text: val('header_text'), receipt_footer: val('receipt_footer') })).join('\n')); msg('Test receipt sent to the printer.'); } catch (e) { if (e && e.name === 'NotFoundError') { return msg('No printer was chosen.'); } msg((e && e.message) || 'Could not print.', true); } };
  document.getElementById('save').onclick = async () => {
    const b = document.getElementById('save'), m = document.getElementById('smsg'); b.disabled = true; b.innerHTML = '<span class="spin"></span> Saving...'; m.innerHTML = '';
    const values = {}; ['shop_name', 'shop_address', 'header_text', 'receipt_footer', 'order_prefix', 'customer_prefix', 'service_prefix', 'category_prefix', 'expense_prefix', 'user_prefix'].forEach((k) => { values[k] = val(k); });
    try { const d = await api('settings.save', { values }); S.data.settings = d.settings; b.disabled = false; b.textContent = 'Save settings'; m.innerHTML = '<div class="strip ok">Settings saved</div>'; vSettingsKeepMsg = true; prev(); } catch (e) { b.disabled = false; b.textContent = e.code === 'network' ? 'Not saved. Try again' : 'Save settings'; if (S.token) { m.innerHTML = '<div class="strip warn">' + esc(e.message) + '</div>'; } }
  };
}
let vSettingsKeepMsg = false;

/* ================= Users ================= */
async function vUsers() {
  if (!can('owner')) { return $app.innerHTML = '<div class="wrap">' + topBar('Users and access', '#/') + '<div class="card">' + lockedBtn('Users') + '</div></div>'; }
  const st = S.data.settings, users = S.data.users || [];
  const perms = [['perm_reports', 'See Reports', 'Sales, profit and cancelled orders'], ['perm_expenses', 'See Expenses', 'The Expenses list and total'], ['perm_services', 'Add and edit services and categories', 'Prices and category names'], ['perm_cancel', 'Cancel an order', 'Staff cannot cancel orders unless you turn this on']];
  $app.innerHTML = '<div class="wrap">' + offlineStrip() + topBar('Users and access', '#/settings', '<button class="btn pri" id="add">' + svg('plus') + 'New user</button>') + '<div class="two"><div class="l"><div class="card tight"><div class="lab" style="padding:16px 16px 8px">Users</div><div class="list">' + users.map((u) => '<div class="item"><span class="av">' + esc(u.name.charAt(0).toUpperCase()) + '</span><div class="grow"><b>' + esc(u.name) + '</b> <span class="pill p-comp">' + (u.role === 'owner' ? 'Owner' : 'Staff') + '</span><div class="small muted">' + (u.active ? 'Can sign in' : 'Turned off, cannot sign in') + '</div></div><button class="iconbtn" data-e="' + u.id + '" aria-label="Edit ' + esc(u.name) + '">' + svg('edit') + '</button></div>').join('') + '</div></div></div>' +
    '<div class="r"><div class="card"><div class="lab">What staff can do</div><div class="small muted">Owners can always do everything. Staff can always create orders, take payments, mark orders as completed, add notes and manage customers.</div>' + perms.map((p) => '<div class="row" style="min-height:60px;border-top:1px solid #E8EEF2"><span class="grow"><b style="font-size:15px">' + p[1] + '</b><br><span class="small muted">' + p[2] + '</span></span><button class="sw" role="switch" data-k="' + p[0] + '" aria-checked="' + (st[p[0]] === 'yes') + '" aria-label="' + p[1] + ' for staff"><i></i></button></div>').join('') + '<div id="pmsg" class="small" role="status"></div><div class="small muted">Only owners can open Settings and manage users.</div></div></div></div></div>';
  document.getElementById('add').onclick = () => userModal(null);
  $app.querySelectorAll('[data-e]').forEach((b) => { b.onclick = () => userModal(users.find((u) => u.id === b.dataset.e)); });
  $app.querySelectorAll('.sw').forEach((b) => { b.onclick = async () => {
    const on = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', String(on)); const m = document.getElementById('pmsg'); m.className = 'small'; m.textContent = 'Saving...';
    try { const d = await api('settings.save', { values: { [b.dataset.k]: on } }); S.data.settings = d.settings; m.textContent = 'Saved'; } catch (e) { b.setAttribute('aria-checked', String(!on)); m.className = 'small err'; m.textContent = e.code === 'network' ? 'Not saved. Try again' : e.message; }
  }; });
}
function userModal(u) {
  let role = u ? u.role : 'staff', active = u ? u.active : true;
  openModal('<h2>' + (u ? 'Edit user' : 'New user') + '</h2>' + field('un', 'user', 'Name', u && u.name) + field('up', 'lock', u ? 'New PIN (leave empty to keep)' : '6-digit PIN', '', { type: 'password', mode: 'numeric', max: 6 }) + '<div class="seg" role="group" aria-label="Role"><button data-r="staff">Staff</button><button data-r="owner">Owner</button></div><div class="row"><span class="grow"><b>Active</b><br><span class="small muted">Turn off instead of deleting, so old orders keep the name.</span></span><button class="sw" id="ua" role="switch" aria-label="Active"><i></i></button></div><div id="merr" class="err" hidden></div><button class="btn pri big block" id="us">Save</button><button class="btn block" id="ux">Cancel</button>', () => {
    const paint = () => { document.querySelectorAll('[data-r]').forEach((b) => b.classList.toggle('on', b.dataset.r === role)); document.getElementById('ua').setAttribute('aria-checked', String(active)); };
    document.querySelectorAll('[data-r]').forEach((b) => { b.onclick = () => { role = b.dataset.r; paint(); }; });
    document.getElementById('ua').onclick = () => { active = !active; paint(); }; paint();
    document.getElementById('ux').onclick = closeModal;
    document.getElementById('us').onclick = () => saving('us', async () => { const d = await api('user.save', { id: u ? u.id : undefined, name: val('un'), pin: val('up'), role, active }); S.data.users = d.users; closeModal(); render(); });
  });
}

/* ---------- start ---------- */
if ('serviceWorker' in navigator && false) { /* offline queue is not part of this version */ }
render();
</script>
